spring:
  application:
    name: streamforge-control-plane
  datasource:
    url: ${CONTROL_PLANE_DB_URL}
    username: ${CONTROL_PLANE_DB_USERNAME}
    password: ${CONTROL_PLANE_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

streamforge:
  local-pipeline:
    workspace: ${STREAMFORGE_LOCAL_PIPELINE_WORKSPACE:.streamforge/workspace}
    input-root: ${STREAMFORGE_LOCAL_PIPELINE_INPUT_ROOT:.}
    artifact-root: ${STREAMFORGE_LOCAL_PIPELINE_ARTIFACT_ROOT:.streamforge/artifacts}
